name: Build Windows Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Create backend virtual environment
        shell: powershell
        run: python -m venv backend\.venv

      - name: Ensure LMU shared-memory dependency
        shell: powershell
        run: |
          if (-not (Test-Path "backend\pyLMUSharedMemory")) {
            git clone --depth 1 https://github.com/TinyPedal/pyLMUSharedMemory.git backend\pyLMUSharedMemory
          }

      - name: Build installer
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\packaging\build_windows_installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LMUTelemetry-Windows-Installer
          path: release/LMUTelemetry-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable app bundle
        uses: actions/upload-artifact@v4
        with:
          name: LMUTelemetry-Windows-AppBundle
          path: dist/LMUTelemetry/**
          if-no-files-found: error
