name: Build Windows Release

on:
  push:
    branches:
      - release
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 0.2.0)"
        required: true
        default: "0.1.0"
        type: string
      publish_release:
        description: "Publish or update a GitHub Release"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-release:
    name: Build Windows release
    runs-on: windows-latest
    env:
      PY_LMU_SHARED_MEMORY_REF: fe089343ff6bdce3531c48bf2c24dbdcbc0ceed3

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        shell: powershell
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
            $publish = "true"
            $tag = "${{ github.ref_name }}"
          }
          elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION
            $publish = $env:INPUT_PUBLISH_RELEASE.ToLowerInvariant()
            $tag = "v$version"
          }
          else {
            $version = "0.1.0-ci.${{ github.run_number }}"
            $publish = "false"
            $tag = "v$version"
          }

          $prerelease = if ($env:INPUT_PRERELEASE) { $env:INPUT_PRERELEASE.ToLowerInvariant() } else { "false" }

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$version'. Expected a value such as 0.2.0 or 0.2.0-beta.1."
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLISH_RELEASE=$publish" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IS_PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Create backend virtual environment
        shell: powershell
        run: python -m venv backend\.venv

      - name: Ensure LMU shared-memory dependency
        shell: powershell
        run: |
          if (-not (Test-Path "backend\pyLMUSharedMemory")) {
            New-Item -ItemType Directory -Path "backend\pyLMUSharedMemory" | Out-Null
            git -C backend\pyLMUSharedMemory init
            git -C backend\pyLMUSharedMemory remote add origin https://github.com/TinyPedal/pyLMUSharedMemory.git
          }
          git -C backend\pyLMUSharedMemory fetch --depth 1 origin $env:PY_LMU_SHARED_MEMORY_REF
          git -C backend\pyLMUSharedMemory checkout --detach $env:PY_LMU_SHARED_MEMORY_REF

      - name: Build Windows artifacts
        shell: powershell
        run: .\packaging\build_windows_installer.ps1 -AppVersion $env:APP_VERSION

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: LMUTelemetry-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/LMUTelemetry-Setup-*.exe
            dist/LMUTelemetry-Windows-Portable-*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "dist\LMUTelemetry-Setup-$env:APP_VERSION.exe"
          $portable = "dist\LMUTelemetry-Windows-Portable-$env:APP_VERSION.zip"
          $checksums = "dist\SHA256SUMS-$env:APP_VERSION.txt"
          $assets = @($installer, $portable, $checksums)

          $existingTags = @(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list existing GitHub Releases (exit code $LASTEXITCODE)."
          }

          if ($existingTags -contains $env:RELEASE_TAG) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          }
          else {
            $flags = @(
              "release", "create", $env:RELEASE_TAG,
              "--target", "${{ github.sha }}",
              "--title", "LMU Telemetry $env:APP_VERSION",
              "--generate-notes"
            )
            if ($env:IS_PRERELEASE -eq "true" -or $env:APP_VERSION -match '-') {
              $flags += "--prerelease"
            }
            gh @flags @assets
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed with exit code $LASTEXITCODE."
          }
